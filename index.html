<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body><title>我們班的環島大冒險</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&display=swap">
<style>
/* 固定單一風格「日系ゆるかわ」：粗圓外框、平塗糖果色、Q 版小學生。全部是平面圖形，不用模糊或陰影濾鏡，舊電腦也跑得順。
   Layout：左邊地圖，右邊進度、下一站、數字、縣市集章；手機上下堆疊。教室投影用白天配色，刻意不做深色模式。 */
:root{
  color-scheme: light;
  --ink:#4a3a35; --ink-soft:#8a766c; --cream:#fff8ec; --paper:#ffffff; --dot:#f6e6cf;
  --accent:#ff8a5b; --good:#4bb27a; --sun:#ffd45e; --pill:#fff1c9;
  --font-fun:"Huninn","jf-openhuninn","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --font-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --emoji:"Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif;
  --line:3px solid var(--ink); --pop:4px 4px 0 var(--ink);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
.next p b{font-family:var(--font-fun);font-weight:400;font-size:18px;color:var(--ink)}
body{background-color:var(--cream);background-image:radial-gradient(var(--dot) 2.5px,transparent 2.6px);background-size:22px 22px;
  color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 28px}
h1,h2,h3{font-family:var(--font-fun);text-wrap:balance;margin:0;font-weight:400}
button{font:inherit;cursor:pointer;color:inherit}
button:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 18px;max-width:2200px;margin:0 auto 16px}
.brand{display:flex;align-items:center;gap:12px}
.brand svg{width:58px;height:58px;flex:none}
.top h1{font-size:clamp(25px,3.4vw,40px);letter-spacing:.04em}
.top h1 .cls{background:var(--sun);border:var(--line);border-radius:12px;padding:0 10px;margin-right:6px;display:inline-block;transform:rotate(-3deg)}
.top h1 small{display:block;font-family:var(--font-fun);font-size:15px;color:var(--ink-soft);letter-spacing:.06em;margin-top:4px}
.app{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(320px,.95fr);gap:20px;max-width:1400px;margin:0 auto}
@media (max-width:860px){.app{grid-template-columns:minmax(0,1fr)}}

.mapwrap{position:relative;border:var(--line);border-radius:28px;overflow:hidden;background:#8fd6f2;height:min(86vh,980px);min-height:520px;box-shadow:6px 6px 0 var(--ink)}
@media (max-width:860px){.mapwrap{height:78vh;min-height:460px}}
#map{width:100%;height:100%;display:block;touch-action:none}
.ctrls{position:absolute;left:12px;top:12px;right:12px;display:flex;flex-wrap:wrap;gap:8px;pointer-events:none}
.seg{display:inline-flex;background:#fff;border:var(--line);border-radius:999px;padding:2px;pointer-events:auto}
.seg button{border:0;background:transparent;padding:5px 12px;border-radius:999px;font-family:var(--font-fun);font-size:15px}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff}
.chipbtn{pointer-events:auto;border:var(--line);background:#fff;border-radius:999px;padding:6px 13px;font-family:var(--font-fun);font-size:15px}
.chipbtn[aria-pressed="true"]{background:var(--sun)}
.chipbtn:active{transform:translateY(1px)}
.chipbtn.gear{padding:6px 10px}
.cfg h2{font-size:26px!important}.cfg p{font-size:15px;line-height:1.7;margin:8px 0}.cfg ol{font-size:14px;line-height:1.7;padding-left:20px;margin:6px 0;color:var(--ink-soft)}
.cfg input{width:100%;box-sizing:border-box;border:2px solid var(--ink);border-radius:12px;padding:9px 12px;font-size:15px;background:#fff;font-family:inherit}
.cfg .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.cfg .row .chipbtn{font-size:16px}.cfg .ok{background:var(--sun)}
.cfg .cur{font-size:13px;color:var(--ink-soft);word-break:break-all}.cfg .err{color:#d1453b;font-size:14px;min-height:1.2em}
.clock{display:flex;align-items:center;gap:12px;background:#fff;border:var(--line);border-radius:20px;padding:6px 16px;box-shadow:var(--pop)}
.clock .d{font-family:var(--font-fun);font-size:clamp(17px,1.8vw,22px);line-height:1.2}
.clock .d small{display:block;font-size:.72em;color:var(--ink-soft)}
.clock .t{font-family:var(--font-fun);font-size:clamp(30px,3.4vw,42px);line-height:1;font-variant-numeric:tabular-nums;background:var(--sun);border:2px solid var(--ink);border-radius:14px;padding:2px 10px}
.topr{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
#map{cursor:grab;user-select:none;-webkit-user-select:none}#map.dragging{cursor:grabbing}
.zoombox{position:absolute;right:12px;top:50%;transform:translateY(-50%);display:grid;gap:8px;pointer-events:auto}
.zoombox button{width:44px;height:44px;border:var(--line);border-radius:14px;background:#fff;font-family:var(--font-fun);font-size:24px;line-height:1;box-shadow:3px 3px 0 var(--ink)}
.zoombox button:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.menuwrap{position:relative;pointer-events:auto}
.menu{position:absolute;left:0;top:calc(100% + 6px);background:#fff;border:var(--line);border-radius:16px;padding:6px;display:grid;gap:4px;min-width:170px;box-shadow:var(--pop);z-index:5}
.menu button{border:0;background:transparent;text-align:left;padding:7px 10px;border-radius:10px;font-family:var(--font-fun);font-size:15px}
.menu button:hover,.menu button:focus-visible{background:var(--pill)}
.menu small{display:block;color:var(--ink-soft);font-size:12px}
.toast{position:absolute;left:50%;bottom:72px;transform:translateX(-50%);background:#fff;border:var(--line);border-radius:999px;padding:6px 16px;font-family:var(--font-fun);font-size:18px;box-shadow:var(--pop);white-space:nowrap;pointer-events:none;animation:toastIn .25s ease-out}
@keyframes toastIn{from{transform:translate(-50%,8px);opacity:0}}
.replaytag{position:absolute;left:50%;transform:translateX(-50%);bottom:12px;white-space:nowrap;z-index:3;display:flex;align-items:center;gap:10px;background:var(--sun);border:var(--line);border-radius:16px;padding:6px 8px 6px 14px;font-family:var(--font-fun);font-size:17px;box-shadow:var(--pop)}
.replaytag button{border:2px solid var(--ink);background:#fff;border-radius:10px;padding:2px 10px;font-family:var(--font-fun)}
.legend{position:absolute;left:12px;bottom:12px;display:grid;gap:2px;background:#fff;border:2.5px solid var(--ink);border-radius:14px;padding:6px 10px;font-family:var(--font-fun);font-size:13px;box-shadow:3px 3px 0 var(--ink);pointer-events:none}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{display:inline-block;width:22px;height:6px;border-radius:3px}
@media (max-width:600px){.legend{display:none}}
.status{position:absolute;right:12px;bottom:12px;background:#fff;border:2px solid var(--ink);border-radius:10px;padding:2px 10px;font-size:13px;color:var(--ink-soft)}

.panel{display:flex;flex-direction:column;gap:18px;min-width:0}
.card{background:var(--paper);border:var(--line);border-radius:24px;padding:16px 20px;min-width:0;box-shadow:var(--pop)}
.hero{display:grid;gap:10px}
.km{font-family:var(--font-fun);font-size:clamp(48px,6vw,76px);line-height:1;font-variant-numeric:tabular-nums}
.km span{font-size:.34em;color:var(--ink-soft)}
.where{font-size:16px}
.where b{font-family:var(--font-fun);font-weight:400;font-size:20px;background:linear-gradient(transparent 60%,var(--pill) 60%)}
.bar{position:relative;height:26px;border:var(--line);border-radius:999px;background:#fff;overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;background:repeating-linear-gradient(-45deg,var(--accent) 0 10px,#ffa98a 10px 20px);transition:width .2s}
.ticks{position:relative;height:16px;font-size:12px;color:var(--ink-soft);font-family:var(--font-fun)}
.ticks span{position:absolute;transform:translateX(-50%)}
.ticks span:first-child{transform:none}
.ticks span{white-space:nowrap}.ticks span:last-child{transform:translateX(-80%)}
.next{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 14px;align-items:center}
.emo{display:grid;place-items:center;border:var(--line);border-radius:50%;line-height:1;font-family:var(--emoji)}
.next .emo{grid-row:span 2;width:70px;height:70px;font-size:38px}
.next h3{font-size:23px}
.next p{margin:0;color:var(--ink-soft)}
.next .nums{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.pill{background:var(--pill);border:2px solid var(--ink);border-radius:14px;padding:5px 12px;font-variant-numeric:tabular-nums}
.pill b{font-family:var(--font-fun);font-weight:400;font-size:20px}
.stat{border:2px solid var(--ink);border-radius:16px;padding:7px 10px}
.stat:nth-child(1){background:#ffe9ef}.stat:nth-child(2){background:#e6f4ff}.stat:nth-child(3){background:#eaf8e6}.stat:nth-child(4){background:#fff3d6}
.stat .v{font-family:var(--font-fun);font-size:22px;font-variant-numeric:tabular-nums;line-height:1.2}
.stat .l{font-size:12px;color:var(--ink-soft)}
.cardhead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.cardhead h2{font-size:22px}
.cardhead span{color:var(--ink-soft);font-size:14px;font-family:var(--font-fun)}
.stamps{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:10px}
.stamp{aspect-ratio:1;max-width:100%;border:0;padding:0;background:none;display:grid;place-items:center;cursor:pointer}
.stamp img,.stamp .e{width:100%;height:100%;max-width:100%;max-height:100%;aspect-ratio:1;object-fit:contain;border-radius:50%;filter:grayscale(1);opacity:.3;transition:transform .2s}
.stamp .e{display:grid;place-items:center;font-family:var(--emoji);font-size:min(9vw,48px);background:#fff8e0;border:3px solid var(--ink)}
.stamp.on img,.stamp.on .e{filter:none;opacity:1;box-shadow:3px 3px 0 var(--ink)}
.stamp.on img{border:3px solid var(--ink)}
.stamp.on:hover img,.stamp.on:hover .e{transform:rotate(-6deg) scale(1.05)}
.next .emo .bi,.mcard .big .bi{width:100%;height:100%;border-radius:50%;display:block}
.mcard .big.locked .bi{filter:grayscale(1)}
.note{font-size:13px;color:var(--ink-soft);margin:12px 0 0}

.modal{position:fixed;inset:0;background:rgba(74,58,53,.45);display:grid;place-items:center;z-index:50;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.mcard{background:var(--paper);border:var(--line);border-radius:28px;max-width:520px;width:100%;padding:22px 22px 18px;box-shadow:8px 8px 0 var(--ink);
  max-height:90vh;overflow:auto;animation:pop .45s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(.6) rotate(-4deg);opacity:0}to{transform:none;opacity:1}}
.mcard .big{width:120px;height:120px;margin:0 auto;font-size:66px}
.mcard .big.locked span{opacity:.3}
.mcard .kick{text-align:center;font-family:var(--font-fun);color:var(--accent);font-size:18px;margin-top:8px}
.mcard h2{text-align:center;font-size:34px;margin:2px 0 4px}
.mcard .county{text-align:center;color:var(--ink-soft);font-size:14px}
.mcard .fact{font-size:19px;line-height:1.75;margin:14px 0}
.quiz{background:var(--pill);border:2px solid var(--ink);border-radius:18px;padding:12px 14px}
.quiz .q{font-family:var(--font-fun);font-size:19px;margin-bottom:8px}
.opts{display:grid;gap:8px}
.opt{text-align:left;border:2px solid var(--ink);background:#fff;border-radius:14px;padding:8px 12px;font-size:17px;font-family:var(--font-fun);box-shadow:3px 3px 0 var(--ink)}
.opt:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.opt.right{background:var(--good);color:#fff}
.opt.wrong{color:#c0392b;text-decoration:line-through;opacity:.6}
.qmsg{margin-top:8px;font-family:var(--font-fun);font-size:17px;min-height:1.4em}
.qmsg.ok{color:var(--good)}.qmsg.no{color:#c0392b}
.also{font-size:14px;color:var(--ink-soft);margin-top:10px}
.btnrow{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;justify-content:center}
.btn{border:var(--line);border-radius:16px;padding:8px 22px;background:var(--accent);color:#fff;font-family:var(--font-fun);font-size:18px;box-shadow:4px 4px 0 var(--ink)}
.btn:active{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--ink)}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:60}

/* 卡片依螢幕高度縮放，避免需要上下捲動 */
.mcard{max-height:94vh;max-height:94dvh;padding:clamp(12px,2.4vh,22px) 22px clamp(10px,2vh,18px)}
.mcard .big{width:clamp(64px,13vh,120px);height:clamp(64px,13vh,120px);font-size:clamp(36px,7vh,66px)}
.mcard .kick{font-size:clamp(15px,2.2vh,18px);margin-top:clamp(2px,.8vh,8px)}
.mcard h2{font-size:clamp(24px,4.2vh,34px)}
.mcard .fact{font-size:clamp(15px,2.3vh,19px);line-height:1.6;margin:clamp(6px,1.4vh,14px) 0}
.mcard .quiz{padding:clamp(8px,1.2vh,12px) 14px}
.mcard .quiz .q{font-size:clamp(15px,2.3vh,19px);margin-bottom:clamp(4px,.8vh,8px)}
.mcard .opts{gap:clamp(5px,.9vh,8px)}
.mcard .opt{font-size:clamp(14px,2.1vh,17px);padding:clamp(4px,.9vh,8px) 12px}
.mcard .btnrow{margin-top:clamp(6px,1.4vh,14px)}

/* 卡片排版：徽章大圖在左、名稱與小知識在右；三個選項排成一列 */
.mcard{max-width:760px}
.mc-in .cL{display:grid;grid-template-columns:auto 1fr;column-gap:clamp(14px,2.4vw,26px);align-items:center;text-align:left}
.mc-in .cL .big{grid-row:1 / span 4;width:clamp(110px,24vh,190px);height:clamp(110px,24vh,190px);font-size:clamp(60px,13vh,104px);margin:0}
.mc-in .cL .kick,.mc-in .cL h2,.mc-in .cL .county{text-align:left;margin-left:0}
.mc-in .cL .kick{margin-top:0}
.mc-in .cL h2{margin:0 0 2px}
.mc-in .cL .fact{margin:clamp(4px,1vh,10px) 0 0}
.mc-in .cR{margin-top:clamp(10px,1.8vh,16px)}
.mcard .qmsg:empty{display:none}
@media (min-width:560px){.mcard .opts{grid-template-columns:repeat(3,1fr)}.mcard .opt{text-align:center}}
@media (max-width:480px){.mc-in .cL{grid-template-columns:1fr;text-align:center}.mc-in .cL .big{grid-row:auto;margin:0 auto 6px;width:120px;height:120px}
  .mc-in .cL .kick,.mc-in .cL h2,.mc-in .cL .county{text-align:center}}
.mcard{overflow:auto;animation:none}.mc-in{animation:pop .45s cubic-bezier(.2,1.6,.4,1)}
@media (prefers-reduced-motion:reduce){.mcard,.mc-in{animation:none}}

#map text{font-family:var(--font-fun)}
#map .lbl{fill:var(--ink);paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round}
#map .sea{fill:#fff;letter-spacing:6px}
#map .e{font-family:var(--emoji)}
#map .st{cursor:pointer}
#map .st.locked .badge{fill:#f3eee9}
#map .st.locked .bimg{filter:grayscale(1);opacity:.4}
#map .st.here .bring{stroke:#ff8a5b;stroke-width:4}
#map .st.here .badge.bring{fill:none}
#map .st.locked .e{opacity:.3}
#map .geo-m{fill:#22804a}#map .geo-i{fill:#1d6fbf}
#map .clbl{fill:var(--ink);paint-order:stroke;stroke:#fff;stroke-width:4.5px;stroke-linejoin:round;letter-spacing:2px;pointer-events:none}
#map .st .plate,#map .st .ptxt{display:none}
#map .st.here .plate,#map .st.here .ptxt{display:inline}
#map .st.locked .ptxt{fill:#a89a91}
#map .st.here .badge{fill:var(--sun)}
#map .st:focus-visible .badge{stroke:var(--accent);stroke-width:4}
#map .cloud{animation:drift 30s ease-in-out infinite}
@keyframes drift{0%,100%{transform:translateX(-18px)}50%{transform:translateX(18px)}}
#map .bob{animation:bob .36s ease-in-out infinite}
#map .bob2{animation:bob .36s ease-in-out infinite;animation-delay:-.18s}
@keyframes bob{50%{transform:translateY(-3px)}}
#map .leg{transform-box:fill-box;transform-origin:50% 0;animation:swing .36s ease-in-out infinite}
#map .leg.b{animation-direction:reverse}
#map .arm{transform-box:fill-box;transform-origin:50% 0;animation:swing .36s ease-in-out infinite reverse}
#map .arm.b{animation-direction:normal}
@keyframes swing{0%,100%{transform:rotate(-30deg)}50%{transform:rotate(30deg)}}
#map .twinkle{animation:tw 2.4s ease-in-out infinite}
@keyframes tw{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){#map .cloud,#map .bob,#map .bob2,#map .leg,#map .arm,#map .twinkle{animation:none}}
@media (min-width:861px) and (min-height:560px){
  html,body{height:100%}
  body{display:flex;flex-direction:column;overflow:hidden;padding-block:12px 16px}
  .top{margin-bottom:12px;width:100%}
  .app{flex:1;min-height:0;width:100%;max-width:2200px}
  .mapwrap{height:100%!important;min-height:0!important}
  .panel{min-height:0;gap:14px}
  .card{padding:12px 18px}
  .hero{gap:8px}
  .km{font-size:clamp(44px,7vh,76px)}
  .next .emo{width:clamp(50px,7vh,70px);height:clamp(50px,7vh,70px);font-size:clamp(28px,4vh,38px)}
  .stampcard{flex:1;min-height:0;display:flex;flex-direction:column;overflow:auto}
  .stamps{grid-template-columns:repeat(var(--cols,6),minmax(0,1fr));grid-template-rows:repeat(3,minmax(34px,1fr));gap:clamp(5px,1.1vh,12px);flex:1;min-height:0}
  .stamp{aspect-ratio:auto;width:100%;height:100%;min-height:0;min-width:0;container-type:size;overflow:visible}
  /* 徽章永遠是正圓：取格子寬、高中較小的一邊 */
  .stamp img,.stamp .e{width:calc(min(100cqw,100cqh) - 6px);height:calc(min(100cqw,100cqh) - 6px);max-width:none;max-height:none}
  .stamp .e{font-size:calc(min(100cqw,100cqh) * .5)}
  .note{margin-top:8px}
}
@media (min-width:861px) and (min-height:560px) and (max-height:660px){.top h1{font-size:24px}.top h1 small{display:none}.brand svg{width:44px;height:44px}.clock{padding:4px 12px}.clock .t{font-size:26px}.clock .d{font-size:15px}.km{font-size:38px}.where{font-size:14px}.where b{font-size:17px}.next h3{font-size:19px}.panel{gap:10px}.app{gap:14px}.stamps{grid-template-rows:repeat(3,minmax(30px,1fr))}.bar{height:20px}}
@media (min-width:861px) and (min-height:560px) and (max-height:780px){.note{display:none}.top h1 small{font-size:13px;margin-top:0}.top{margin-bottom:8px}.card{padding:10px 16px}}
</style>

<header class="top">
  <div class="brand">
    <svg viewBox="0 0 60 60" aria-hidden="true"><circle cx="30" cy="30" r="26" fill="#ffd45e" stroke="#4a3a35" stroke-width="3"/><circle cx="22" cy="27" r="2.6" fill="#4a3a35"/><circle cx="38" cy="27" r="2.6" fill="#4a3a35"/><ellipse cx="16" cy="33" rx="4" ry="2.6" fill="#ff9fb0"/><ellipse cx="44" cy="33" rx="4" ry="2.6" fill="#ff9fb0"/><path d="M25 35 Q30 41 35 35" fill="none" stroke="#4a3a35" stroke-width="2.6" stroke-linecap="round"/></svg>
    <h1><span class="cls" id="className">410班</span>環島大冒險<small id="subTitle">從台南出發・繞台灣一圈 1000 公里・每一圈都算數！</small></h1>
  </div>
  <div class="topr">
    <div class="clock" aria-live="off"><div class="d" id="clkDate">　</div><div class="t" id="clkTime">--:--</div></div>
    <button class="chipbtn" id="fsBtn" type="button">全螢幕投影</button>
    <button class="chipbtn gear" id="cfgBtn" type="button" aria-label="連結試算表設定" title="連結試算表設定">⚙</button>

// 依起始站重新排列路線：環島一圈 990 公里回到起點，最後 10 公里在起點附近完成 1000 公里
function buildRoute(sid){
  if(!LOOP_RAW.includes(sid))sid="tainan";
  START_ID=sid;
  const s0=ST0.find(x=>x.id===sid),k0=s0.km,sh=k=>(k-k0+LOOP)%LOOP;
  const loop=ST0.filter(x=>x.id!=="back"&&x.id!=="finish").map(x=>({...x,km:sh(x.km)})).sort((p,q)=>p.km-q.km);
  const b0=ST0.find(x=>x.id==="back"),f0=ST0.find(x=>x.id==="finish");
  ST=loop.concat([{...b0,name:"回到"+s0.name,county:s0.county,ll:s0.ll,fact:`回到${s0.name}了！我們已經繞了台灣一圈。再跑 10 公里，就完成 1000 公里的目標！`},
    {...f0,county:s0.county,ll:s0.ll}]);
  STI=Object.fromEntries(ST.map((x,i)=>[x.id,i]));
  const i0=LOOP_RAW.indexOf(sid),raw=LOOP_RAW.slice(i0).concat(LOOP_RAW.slice(0,i0),["back","finish"]);
  const pts=raw.map(r=>typeof r==="string"?{ll:ST[STI[r]].ll,km:ST[STI[r]].km}:{ll:r,km:null});
  let last=0;
  for(let i=1;i<pts.length;i++){
    if(pts[i].km==null)continue;
    const seg=[0];for(let j=last+1;j<=i;j++){const a=pts[j-1].ll,b=pts[j].ll;seg.push(seg[seg.length-1]+Math.hypot((b[0]-a[0])*CX,b[1]-a[1]));}
    const tot=seg[seg.length-1]||1;
    for(let j=last+1;j<i;j++)pts[j].km=pts[last].km+(pts[i].km-pts[last].km)*seg[j-last]/tot;
    last=i;
  }
  pts.forEach(p=>p.xy=P(p.ll[0],p.ll[1]));
  ROUTE=pts;
  // 路線顏色跟著地理區域（西、北、東、南），起點換了也一樣
  REGIONS=[];REGIONS0.forEach(r=>{const a=sh(r.a),len=r.b-r.a;
    if(a+len<=LOOP+1e-6)REGIONS.push({c:r.c,a,b:a+len});else{REGIONS.push({c:r.c,a,b:LOOP});REGIONS.push({c:r.c,a:0,b:a+len-LOOP});}});
}

function posAt(km){
  km=Math.max(0,Math.min(1000,km));
  for(let i=1;i<ROUTE.length;i++){
    if(km<=ROUTE[i].km){const a=ROUTE[i-1],b=ROUTE[i],t=(km-a.km)/((b.km-a.km)||1);
      return {xy:[a.xy[0]+(b.xy[0]-a.xy[0])*t,a.xy[1]+(b.xy[1]-a.xy[1])*t],i,dir:Math.sign(b.xy[0]-a.xy[0])||1};}
  }
  return {xy:ROUTE[ROUTE.length-1].xy,i:ROUTE.length-1,dir:-1};
}

function lastReached(km){let r=ST[0];for(const s of ST)if(s.km<=km+1e-6)r=s;return r;}
const nextStation=km=>ST.find(s=>s.km>km+1e-6)||null;
function updateRunner(force){
  const km=state.shownKm,pos=posAt(km),rp=pos.xy;
  const pts=ROUTE.slice(0,pos.i).map(r=>r.xy);pts.push(rp);refs.base.setAttribute("d",poly(pts));
  REGIONS.forEach((r,ri)=>{const hi=Math.min(r.b,km);let d="";
    if(hi>r.a){const pa=posAt(r.a),pb=posAt(hi),q=[pa.xy];for(let i=pa.i;i<pb.i;i++)q.push(ROUTE[i].xy);q.push(pb.xy);d=poly(q);}
    refs.segs[ri].setAttribute("d",d);});
  refs.runner.setAttribute("transform",`translate(${rp[0].toFixed(1)} ${rp[1].toFixed(1)}) scale(${state.zoom==="follow"?1.5:1.15})`);
  refs.flip.setAttribute("transform",pos.dir<0?"scale(-1 1)":"");refs.flip.classList.toggle("flip",pos.dir<0);
  // 只有狀態真的改變時才更新站點和縣市顏色，避免每一格畫面都重算
  const here=lastReached(km),hid=(here.id==="finish"||here.id==="back")?START_ID:here.id,locked=String(refs.sts.filter(o=>o.s.km>km+1e-6).length);
  if(force||hid!==lastHere||locked!==lastLocked){lastHere=hid;lastLocked=locked;
    refs.sts.forEach(o=>{o.g.classList.toggle("locked",o.s.km>km+1e-6);o.g.classList.toggle("here",o.g.dataset.id===hid);});
    const v=visited(km);refs.counties.forEach(p=>{const n=p.dataset.c;p.setAttribute("fill",n==="南投縣"?"url(#hatch)":(v.has(n)?CC[n]:pale(CC[n])));});}
  updatePanel(km);
}

let vb=[0,0,W,H];
function targetVB(){
  const el=svg.getBoundingClientRect(),asp=(el.height||1)/(el.width||1);
  if(state.zoom==="free"&&freeVB)return freeVB;
  if(state.zoom==="follow"){const c=posAt(state.shownKm).xy,w=250,h=w*asp;return [c[0]-w/2,c[1]-h*0.55,w,h];}
  const top=-70,ch=H+110,cw=W+20;let w=cw,h=cw*asp;if(h<ch){h=ch;w=h/asp;}
  return [(W-w)/2,top+(ch-h)/2,w,h];
}
let raf=null,anim=null,freeVB=null;
function tick(){
  raf=null;let busy=false;
  if(anim){const t=Math.min(1,(performance.now()-anim.t0)/anim.dur),e=anim.linear?(t<.08?t*t/.16:t>.92?1-(1-t)*(1-t)/.16:t-.04):(t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2);
    const prev=state.shownKm;state.shownKm=anim.from+(anim.to-anim.from)*e;updateRunner();busy=true;passStations(prev,state.shownKm);
    if(anim.replay)showReplayDate();
    if(t>=1){const done=anim;anim=null;state.shownKm=done.to;updateRunner();document.getElementById("replayTag").hidden=true;done.cb&&done.cb();}}
  const tv=targetVB();let moved=false;
  for(let i=0;i<4;i++){const d=tv[i]-vb[i];if(Math.abs(d)>0.3){vb[i]+=d*0.16;moved=true;}else vb[i]=tv[i];}
  svg.setAttribute("viewBox",vb.map(v=>v.toFixed(1)).join(" "));
  if(busy||moved)raf=requestAnimationFrame(tick);
}
const kick=()=>{if(!raf)raf=requestAnimationFrame(tick);};
window.addEventListener("resize",kick);
function runTo(to,from,cb,opt){
  opt=opt||{};
  if(from==null||anim)from=state.shownKm;
  const dist=Math.abs(to-from);
  if(dist<0.01||matchMedia("(prefers-reduced-motion: reduce)").matches){anim=null;state.shownKm=to;updateRunner();kick();cb&&cb(from,to);return;}
  const dur=opt.replay?Math.min(25000,Math.max(1800,dist*26)):Math.min(6000,Math.max(900,dist*45));
  anim={from,to,t0:performance.now(),dur,replay:!!opt.replay,linear:!!opt.replay,cb:()=>cb&&cb(from,to)};kick();
}

function toast(t){const el=document.getElementById("toast");el.textContent=t;el.hidden=false;el.style.animation="none";void el.offsetWidth;el.style.animation="";clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.hidden=true,1800);}
function passStations(a,b){if(b<=a)return;const c=ST.filter(s=>s.km>a+1e-6&&s.km<=b+1e-6);if(c.length){const s=c[c.length-1];toast(`${s.e} 抵達 ${s.name}！`);}}

// ---------- 手動瀏覽地圖：拖曳移動、滾輪／雙指縮放、＋－按鈕 ----------
function fullW(){const el=svg.getBoundingClientRect(),asp=(el.height||1)/(el.width||1);return Math.max(W+20,(H+110)/asp)*2.6;}
function goFree(){if(state.zoom!=="free"){state.zoom="free";freeVB=vb.slice();setPressed("[data-zoom]",null);}}
function zoomAt(px,py,f){
  goFree();const r=svg.getBoundingClientRect(),base=freeVB;
  const ux=base[0]+(px-r.left)/r.width*base[2],uy=base[1]+(py-r.top)/r.height*base[3];
  const nw=Math.max(80,Math.min(fullW(),base[2]*f)),k2=nw/base[2];
  freeVB=[ux-(ux-base[0])*k2,uy-(uy-base[1])*k2,nw,base[3]*k2];
}
const ptrs=new Map();let drag=null,pinch=null,suppressClick=false;
svg.addEventListener("pointerdown",e=>{
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size===1)drag={x:e.clientX,y:e.clientY,moved:false,id:e.pointerId};
  else if(ptrs.size===2){const [a,b]=[...ptrs.values()];goFree();pinch={d:Math.hypot(a.x-b.x,a.y-b.y),vb0:freeVB.slice()};drag=null;}
});
svg.addEventListener("pointermove",e=>{
  if(!ptrs.has(e.pointerId))return;ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pinch&&ptrs.size>=2){const [a,b]=[...ptrs.values()],d=Math.hypot(a.x-b.x,a.y-b.y);if(d>0){freeVB=pinch.vb0.slice();zoomAt((a.x+b.x)/2,(a.y+b.y)/2,pinch.d/d);vb=freeVB.slice();svg.setAttribute("viewBox",vb.join(" "));}return;}
  if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;
  if(!drag.moved){if(Math.hypot(dx,dy)<5)return;drag.moved=true;goFree();drag.vb0=vb.slice();freeVB=vb.slice();svg.classList.add("dragging");try{svg.setPointerCapture(e.pointerId);}catch(err){}}
  const r=svg.getBoundingClientRect(),u=drag.vb0[2]/r.width;
  freeVB=[drag.vb0[0]-dx*u,drag.vb0[1]-dy*u,drag.vb0[2],drag.vb0[3]];vb=freeVB.slice();svg.setAttribute("viewBox",vb.map(v=>v.toFixed(1)).join(" "));
});
function endPtr(e){ptrs.delete(e.pointerId);if(ptrs.size<2)pinch=null;if(drag&&drag.moved)suppressClick=true;if(ptrs.size===0){drag=null;svg.classList.remove("dragging");}}
svg.addEventListener("pointerup",endPtr);svg.addEventListener("pointercancel",endPtr);
svg.addEventListener("click",e=>{if(suppressClick){suppressClick=false;e.stopPropagation();e.preventDefault();}},true);
svg.addEventListener("wheel",e=>{e.preventDefault();zoomAt(e.clientX,e.clientY,Math.exp(e.deltaY*0.0015));kick();},{passive:false});
document.getElementById("zIn").addEventListener("click",()=>{const r=svg.getBoundingClientRect();zoomAt(r.left+r.width/2,r.top+r.height/2,0.7);kick();});
document.getElementById("zOut").addEventListener("click",()=>{const r=svg.getBoundingClientRect();zoomAt(r.left+r.width/2,r.top+r.height/2,1.4);kick();});

let lastStampKey="";
function updatePanel(km){
  const s=state.settings;
  document.getElementById("kmNow").innerHTML=`${fmt(km)}<span> / 1000 公里</span>`;
  document.getElementById("barFill").style.width=(km/10)+"%";
  const here=lastReached(km),nx=nextStation(km),w=document.getElementById("whereNow");
  if(km>=1000)w.innerHTML=`🎉 <b>完成環島！</b>全班一起繞了台灣一圈`;
  else if(km<0.05)w.innerHTML=`準備從 <b>${esc(ST[0].name)}</b> 出發！`;
  else if(Math.abs(km-here.km)<0.5)w.innerHTML=`剛抵達 <b>${esc(here.name)}</b>（${esc(here.county)}）`;
  else w.innerHTML=`正在 <b>${esc(here.name)}</b> 和 <b>${esc(nx.name)}</b> 之間`;
  const nc=document.getElementById("nextCard");
  if(!nx)nc.innerHTML=`<div class="emo" style="background:#fff1c9">🏆</div><h3>環島完成</h3><p>可以挑戰第二圈，或把這趟旅程畫成一張地圖日記。</p>`;
  else{const rem=nx.km-km;
    nc.innerHTML=`<div class="emo" style="background:${pale(CC[nx.county])}">${bimg(nx,"bi")||nx.e}</div><h3>下一站：${esc(nx.name)}</h3><p>${esc(nx.county)}・還差 <b>${fmt(rem)}</b> 公里</p>`;}
  // 集章：路線上有徽章圖片的站點，最後一格是環島完成獎盃；只顯示圖案、不顯示文字
  const list=ST.filter(x=>x.b).concat([ST[STI.finish]]);
  const got=list.filter(c=>c.km<=km+1e-6).length;
  if(START_ID+got!==lastStampKey){lastStampKey=START_ID+got;
    document.getElementById("stampCount").textContent=`${got} / ${list.length}`;
    document.getElementById("stamps").style.setProperty("--cols",Math.ceil(list.length/3));
    document.getElementById("stamps").innerHTML=list.map(c=>`<button type="button" class="stamp ${c.km<=km+1e-6?"on":""}" data-id="${c.id}" title="${c.name}（${c.county}）：第 ${c.km} 公里" aria-label="${c.name}">${BADGE[c.b]?`<img src="${BADGE[c.b]}" alt="">`:`<span class="e">${c.e}</span>`}</button>`).join("");}
}

const modal=document.getElementById("modal"),mcard=document.getElementById("mcard");
document.getElementById("stamps").addEventListener("click",e=>{const b=e.target.closest(".stamp");if(b)showCard(ST[STI[b.dataset.id]]);});
let curQ=null;
function showCard(s,opts={}){
  const km=state.shownKm;
  if(s.km>km+1e-6){
    curQ=null;
    mcard.innerHTML=`<div class="mc-in"><div class="cL"><div class="emo big locked" style="background:#f3eee9"><span>${bimg(s,"bi")||s.e}</span></div><h2 id="mTitle">${esc(s.name)}</h2><div class="county">${esc(s.county)}・第 ${s.km} 公里</div>
    <p class="fact">還沒到喔！再跑 <b>${fmt(s.km-km)}</b> 公里就會抵達，到了才能打開這張卡片。</p></div>
    <div class="cR"><div class="quiz"><div class="q">先猜猜看：${esc(s.q)}</div></div>
    <div class="btnrow"><button class="btn" type="button" data-close>好，繼續跑！</button></div></div></div>`;
  }else{
    curQ=s;
    const order=s.o?s.o.map((t,i)=>({t,i})).sort(()=>Math.random()-.5):[];
    mcard.innerHTML=`<div class="mc-in"><div class="cL"><div class="emo big" style="background:${pale(CC[s.county])}">${bimg(s,"bi")||s.e}</div><div class="kick">${opts.arrive?"🎉 抵達新站！":"第 "+s.km+" 公里"}</div><h2 id="mTitle">${esc(s.name)}</h2><div class="county">${esc(s.county)}</div>
    <p class="fact">${esc(s.fact)}</p></div>
    <div class="cR"><div class="quiz"><div class="q">考考你：${esc(s.q)}</div>
      ${s.o?`<div class="opts">${order.map((x,j)=>`<button type="button" class="opt" data-i="${x.i}">${"ABC"[j]}. ${esc(x.t)}</button>`).join("")}</div><div class="qmsg" aria-live="polite"></div>`:`<div class="qmsg ok">每個人的答案都不一樣，跟同學分享吧！</div>`}</div>
    ${opts.also&&opts.also.length?`<div class="also">這次也經過了：${opts.also.length>6?`${opts.also.slice(0,6).map(x=>x.e+" "+esc(x.name)).join("、")} 等 ${opts.also.length} 站`:opts.also.map(x=>x.e+" "+esc(x.name)).join("、")}</div>`:""}
    <div class="btnrow"><button class="btn" type="button" data-close>${opts.arrive?"太棒了！":"關閉"}</button></div></div></div>`;
    if(opts.arrive)confetti();
  }
  modal.hidden=false;fitCard();mcard.querySelector("[data-close]").focus({preventScroll:true});
}
mcard.addEventListener("click",e=>{
  if(e.target.closest("[data-close]")){modal.hidden=true;return;}
  const b=e.target.closest(".opt");if(!b||!curQ||b.disabled)return;
  const qm=mcard.querySelector(".qmsg");
  if(+b.dataset.i===curQ.a){b.classList.add("right");mcard.querySelectorAll(".opt").forEach(x=>x.disabled=true);qm.className="qmsg ok";qm.textContent="答對了！好厲害 👏";}
  else{b.classList.add("wrong");b.disabled=true;qm.className="qmsg no";qm.textContent="再想想看，還有機會！";}
  fitCard();
});
modal.addEventListener("click",e=>{if(e.target===modal)modal.hidden=true;});
// 卡片內容太高時整張縮小，讓徽章、題目、按鈕都完整顯示，不用捲動
function fitCard(){const inn=mcard.querySelector(".mc-in");if(!inn)return;let z=1;inn.style.zoom=1;mcard.scrollTop=0;
  while(z>0.5&&mcard.scrollHeight>mcard.clientHeight+1){z-=0.05;inn.style.zoom=z;}mcard.scrollTop=0;}
addEventListener("resize",()=>{if(!modal.hidden)fitCard();});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!modal.hidden)modal.hidden=true;});
function arrivals(from,to){const c=ST.filter(s=>s.km>from+1e-6&&s.km<=to+1e-6);if(c.length)showCard(c[c.length-1],{arrive:true,also:c.slice(0,-1)});}
function confetti(){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  const c=document.getElementById("confetti"),x=c.getContext("2d");c.width=innerWidth;c.height=innerHeight;
  const cols=["#ff8a5b","#ffd45e","#8fcfff","#8fe0b8","#ffadc4","#c6b2f3"];
  const ps=Array.from({length:120},()=>({x:innerWidth/2,y:innerHeight*.35,vx:(Math.random()-.5)*14,vy:-Math.random()*12-4,r:Math.random()*7+4,c:cols[Math.random()*6|0]}));
  let f=0;(function step(){x.clearRect(0,0,c.width,c.height);ps.forEach(p=>{p.vy+=.32;p.x+=p.vx;p.y+=p.vy;x.fillStyle=p.c;x.beginPath();x.arc(p.x,p.y,p.r/2,0,7);x.fill();});
    if(++f<140)requestAnimationFrame(step);else x.clearRect(0,0,c.width,c.height);})();
}

function setPressed(sel,btn){document.querySelectorAll(sel).forEach(x=>x.setAttribute("aria-pressed",x===btn));}
document.querySelectorAll("[data-zoom]").forEach(b=>b.addEventListener("click",()=>{state.zoom=b.dataset.zoom;setPressed("[data-zoom]",b);updateRunner();kick();}));
const rBtn=document.getElementById("replayBtn"),rMenu=document.getElementById("replayMenu");
rBtn.addEventListener("click",()=>{rMenu.hidden=!rMenu.hidden;rBtn.setAttribute("aria-expanded",!rMenu.hidden);});
document.addEventListener("click",e=>{if(!e.target.closest(".menuwrap")){rMenu.hidden=true;rBtn.setAttribute("aria-expanded","false");}});
let replayCum=[];
function showReplayDate(){const km=state.shownKm;const r=replayCum.find(c=>c.cum>=km-1e-6)||replayCum[replayCum.length-1];
  document.getElementById("replayTxt").textContent=r&&r.id?`重播中・📅 ${md(r.id)}`:"重播中・紙本紀錄以前的累計";}
function replay(kind){
  rMenu.hidden=true;rBtn.setAttribute("aria-expanded","false");
  const runs=state.logs.filter(l=>dayKm(l)>0).sort((a,b)=>a.id<b.id?-1:1);
  if(!runs.length){toast("還沒有跑步紀錄喔");return;}
  let cum=state.settings.start||0;replayCum=[{id:"",cum}].concat(runs.map(l=>({id:l.id,cum:(cum+=dayKm(l))})));
  const t=today(),start={last:runs[runs.length-1].id,week:shiftDay(t,-6),month:shiftDay(t,-29),all:"0000"}[kind];
  const from=kind==="all"?0:Math.min(1000,(state.settings.start||0)+runs.filter(l=>l.id<start).reduce((a,l)=>a+dayKm(l),0)),to=state.realKm;
  if(to-from<0.01){toast("這段時間還沒有跑步紀錄");return;}
  modal.hidden=true;anim=null;state.shownKm=from;updateRunner(true);
  document.getElementById("replayTag").hidden=false;showReplayDate();
  setTimeout(()=>runTo(to,from,(f,tt)=>arrivals(f,tt),{replay:true}),400);
}
function today(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;}
function shiftDay(iso,n){const [y,m,d]=iso.split("-").map(Number);const x=new Date(y,m-1,d+n);return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,"0")}-${String(x.getDate()).padStart(2,"0")}`;}
rMenu.querySelectorAll("[data-replay]").forEach(b=>b.addEventListener("click",()=>replay(b.dataset.replay)));
document.getElementById("skipBtn").addEventListener("click",()=>{if(anim)anim.t0=performance.now()-anim.dur;kick();});

document.getElementById("fsBtn").addEventListener("click",()=>{try{const d=document;if(d.fullscreenElement)d.exitFullscreen();else d.documentElement.requestFullscreen().catch(()=>{});}catch(e){}});

// ---------- 資料來源：Google 試算表（公開表只有每日總圈數） ----------
// 連結的 Google 試算表：網址加 ?sheet=ID，或按右上角 ⚙ 貼上 ID／網址（存在這台電腦的瀏覽器）
const DEFAULT_SHEET="1B3CJJoDJ9e2Sg4n4JzGYXNtxgOmYNCTdVboGfOa0hog",SHEET_KEY="huandao-sheet-id";
const parseSheetId=t=>{t=String(t||"").trim();const m=t.match(/\/d\/([a-zA-Z0-9_-]{20,})/)||t.match(/^([a-zA-Z0-9_-]{20,})$/);return m?m[1]:"";};
let SHEET_ID=DEFAULT_SHEET;
try{const q=parseSheetId(new URLSearchParams(location.search).get("sheet"));const v=localStorage.getItem(SHEET_KEY);SHEET_ID=q||parseSheetId(v)||DEFAULT_SHEET;}catch(e){}
const statusEl=document.getElementById("status");
const setStatus=t=>{statusEl.textContent=t;statusEl.hidden=!t;};
const SEEN_KEY="huandao-seen-km",CACHE_KEY="huandao-sheet-cache";
const getSeen=()=>{try{const v=localStorage.getItem(SEEN_KEY);return v==null?0:+v||0;}catch(e){return 0;}};
const setSeen=v=>{try{localStorage.setItem(SEEN_KEY,String(v));}catch(e){}};
let jsonpN=0;
function gviz(sheet,query){
  return new Promise((resolve,reject)=>{
    const cb="__gviz"+(++jsonpN)+"_"+Date.now(),sc=document.createElement("script");
    const done=()=>{clearTimeout(t);delete window[cb];sc.remove();};
    const t=setTimeout(()=>{done();reject(new Error("timeout"));},15000);
    window[cb]=r=>{done();if(r&&r.status!=="error")resolve(r.table);else reject(new Error("error"));};
    sc.onerror=()=>{done();reject(new Error("network"));};
    sc.src=`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json;responseHandler:${cb}&headers=1&sheet=${encodeURIComponent(sheet)}&tq=${encodeURIComponent(query)}&_=${Date.now()}`;
    document.head.appendChild(sc);
  });
}
function cellDate(c){
  if(!c||c.v==null)return null;
  if(typeof c.v==="number"){const d=new Date(Date.UTC(1899,11,30)+c.v*864e5);return d.toISOString().slice(0,10);}
  const m=/Date\((\d+),(\d+),(\d+)/.exec(String(c.v));
  if(m)return `${m[1]}-${String(+m[2]+1).padStart(2,"0")}-${String(m[3]).padStart(2,"0")}`;
  return String(c.f||c.v);
}
async function loadSheet(){
  const [logT,setT]=await Promise.all([gviz("每日紀錄","select A, B where A is not null"),gviz("設定","select A, D")]);
  const logs=(logT.rows||[]).map(r=>({id:cellDate(r.c[0]),km:r.c[1]&&typeof r.c[1].v==="number"?r.c[1].v:0})).filter(l=>l.id);
  const st={};(setT.rows||[]).forEach(r=>{const k=r.c[0]&&r.c[0].v,c=r.c[1],v=c?(c.f!=null?c.f:c.v):null;if(k)st[String(k).trim()]=v==null?null:String(v).trim();});
  const pick=(re,def)=>{const k=Object.keys(st).find(x=>re.test(x));const v=k!=null?st[k]:null;return v==null||v===""?def:v;};
  return {logs,settings:{name:String(pick(/班級/,"410班")),start:parseFloat(String(pick(/起始里程|起始公里/,0)).replace(/,/g,""))||0,from:String(pick(/起始縣市|出發縣市/,"台南市"))}};
}
function applyData(d){const oldS=START_ID;state.logs=d.logs;state.settings=d.settings;const sid=startIdOf(d.settings.from);if(sid!==START_ID)buildRoute(sid);document.getElementById("className").textContent=d.settings.name||"我們班";document.title=(d.settings.name||"我們班")+"環島大冒險";if(START_ID!==oldS)drawStatic();}
let firstLoad=true;
async function refresh(){
  try{
    const d=await loadSheet();
    try{localStorage.setItem(CACHE_KEY,JSON.stringify(d));}catch(e){}
    applyData(d);
    const t=new Date();setStatus(`最後更新 ${String(t.getHours()).padStart(2,"0")}:${String(t.getMinutes()).padStart(2,"0")}`);
    const newKm=totalKm();state.realKm=newKm;
    if(firstLoad){firstLoad=false;const seen=Math.min(getSeen(),1000);
      if(newKm>seen){state.shownKm=seen;updateRunner(true);setTimeout(()=>runTo(newKm,seen,(f,to)=>{arrivals(f,to);setSeen(to);}),700);}
      else{state.shownKm=newKm;updateRunner(true);kick();setSeen(newKm);}}
    else if(Math.abs(newKm-state.shownKm)>0.001)runTo(newKm,null,(f,to)=>{if(to>f)arrivals(f,to);setSeen(to);});
    else updatePanel(state.shownKm);
  }catch(e){
    setStatus(navigator.onLine===false?"目前沒有網路，顯示上次的進度":"讀不到試算表：請確認公開表已設為「知道連結的任何人可以檢視」");
    if(firstLoad){firstLoad=false;let c=null;try{c=JSON.parse(localStorage.getItem(CACHE_KEY)||"null");}catch(err){}
      if(c){applyData(c);state.realKm=totalKm();state.shownKm=state.realKm;updateRunner(true);kick();}}
  }
}
document.getElementById("refreshBtn").addEventListener("click",()=>{setStatus("更新中…");refresh();});
function openCfg(){
  const mc=document.getElementById("mcard");
  mc.innerHTML=`<div class="cfg"><h2 id="mTitle">⚙ 連結的試算表</h2>
    <p>貼上 Google 試算表的<b>網址</b>或<b>ID</b>，網頁就會改讀那份試算表。</p>
    <input id="cfgIn" type="text" placeholder="https://docs.google.com/spreadsheets/d/…" autocomplete="off" spellcheck="false">
    <div class="err" id="cfgErr"></div>
    <div class="cur">目前：${esc(SHEET_ID)}${SHEET_ID===DEFAULT_SHEET?"（預設）":""}</div>
    <ol><li>新試算表要有「每日紀錄」「設定」兩個工作表（可用原本的試算表「檔案 → 建立副本」）。</li>
    <li>共用設為「知道連結的任何人 → 檢視者」。</li>
    <li>這個設定只存在這台電腦的瀏覽器；其他電腦可用網址加上 <b>?sheet=試算表ID</b> 開啟。</li></ol>
    <div class="row"><button type="button" class="chipbtn ok" id="cfgSave">儲存並讀取</button><button type="button" class="chipbtn" id="cfgReset">還原預設</button><button type="button" class="chipbtn" id="cfgClose">取消</button></div></div>`;
  modal.hidden=false;
  const inp=mc.querySelector("#cfgIn");setTimeout(()=>inp.focus(),50);
  const use=id=>{const changed=id!==SHEET_ID;SHEET_ID=id;
    try{if(id===DEFAULT_SHEET)localStorage.removeItem(SHEET_KEY);else localStorage.setItem(SHEET_KEY,id);}catch(e){}
    if(changed){try{localStorage.removeItem(CACHE_KEY);localStorage.removeItem(SEEN_KEY);}catch(e){}
      try{const u=new URL(location.href);if(u.searchParams.has("sheet")){u.searchParams.delete("sheet");history.replaceState(null,"",u);}}catch(e){}
      firstLoad=true;state.shownKm=0;}
    modal.hidden=true;setStatus("讀取中…");refresh();};
  mc.querySelector("#cfgSave").onclick=()=>{const id=parseSheetId(inp.value);if(!id){mc.querySelector("#cfgErr").textContent="看不懂這個網址或 ID，請再確認一次。";return;}use(id);};
  inp.addEventListener("keydown",e=>{if(e.key==="Enter")mc.querySelector("#cfgSave").click();});
  mc.querySelector("#cfgReset").onclick=()=>use(DEFAULT_SHEET);
  mc.querySelector("#cfgClose").onclick=()=>{modal.hidden=true;};
}
document.getElementById("cfgBtn").addEventListener("click",openCfg);
drawStatic();kick();refresh();setInterval(refresh,5*60*1000);
})();
</script>
